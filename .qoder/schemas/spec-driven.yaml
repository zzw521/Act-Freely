# Schema: spec-driven
# 定义 artifact 依赖关系、模板和指令，驱动变更提案→规格→设计→任务的完整工作流
name: spec-driven
version: "2.0"

artifacts:
  - id: proposal
    description: 变更提案文档，回答 WHY
    outputPath: proposal.md
    instruction: |
      创建提案文档，回答 WHY this change is needed。

      ## 章节要求
      - **Why**: 1-2 句描述问题或机会。解决什么问题？为什么是现在？
      - **What Changes**: 变更清单。列出新增/修改/移除的能力，用 **BREAKING** 标记破坏性变更。
      - **Capabilities**: 拆分 specs 范围：
        - **New Capabilities**: 新引入的能力。每个将创建 `specs/<name>/spec.md`，使用 kebab-case 命名（例如 user-auth、data-export）。
        - **Modified Capabilities**: 已有 spec 需求变更。列出受影响的已有 spec 名称和变更内容。仅当 spec 级行为变更时才列出。
      - **Impact**: 影响的代码、API、依赖、系统。

      ## 关键约束
      - Capabilities 部分建立 proposal 和 specs 之间的桥梁。每个声明的 capability 后续必须生成对应 spec 文件。
      - 保持简洁（1-2 页），聚焦 WHY 而非 HOW。
      - 这是基础——specs、design 和 tasks 都建立在此之上。
    template: |
      ## Why

      <!-- Explain the motivation for this change. What problem does this solve? Why now? -->

      ## What Changes

      <!-- Describe what will change. Be specific about new capabilities, modifications, or removals. -->

      ## Capabilities

      ### New Capabilities
      <!-- Capabilities being introduced. Replace <name> with kebab-case identifier (e.g., user-auth, data-export, api-rate-limiting). Each creates specs/<name>/spec.md -->
      - `<name>`: <brief description of what this capability covers>

      ### Modified Capabilities
      <!-- Existing capabilities whose REQUIREMENTS are changing (not just implementation).
           Only list here if spec-level behavior changes. Each needs a delta spec file.
           Use existing spec names from openspec/specs/. Leave empty if no requirement changes. -->
      - `<existing-name>`: <what requirement is changing>

      ## Impact

      <!-- Affected code, APIs, dependencies, systems -->
    unlocks: [design, specs]

  - id: specs
    description: 每个 capability 的规格说明文件
    outputPath: specs/
    depends: [proposal]
    instruction: |
      为 proposal 中声明的每个 capability 创建对应的 spec 文件。

      ## 要求
      - 为 proposal 的 New Capabilities 中每个条目创建 `specs/<capability>/spec.md`
      - 为 Modified Capabilities 中每个条目创建/更新 `specs/<capability>/spec.md`
      - 每个 spec 文件包含：概述、API 定义、请求/响应 DTO、错误码、数据模型

      ## Delta 操作（使用 ## headers）
      - **ADDED Requirements**: 新能力
      - **MODIFIED Requirements**: 变更行为——必须包含完整更新内容
      - **REMOVED Requirements**: 废弃功能——必须包含 **Reason** 和 **Migration**
      - **RENAMED Requirements**: 仅名称变更——使用 FROM:/TO: 格式

      ## 格式要求
      - 每个需求项: `### Requirement: <name>` 后跟描述
      - 使用 SHALL/MUST 表示规范性需求（避免 should/may）
      - 每个场景: `#### Scenario: <name>` 使用 WHEN/THEN 格式
      - **关键**: 场景 MUST 使用 4 个 hashtags（`####`）。使用 3 个 hashtags 或 bullet 会静默失败。
      - 每个需求 MUST 至少包含一个场景。

      ## MODIFIED 需求工作流
      1. 在 openspec/specs/<capability>/spec.md 中定位现有需求
      2. 复制整个需求块（从 `### Requirement:` 到所有场景）
      3. 粘贴在 `## MODIFIED Requirements` 下并编辑反映新行为
      4. 确保 header 文本完全匹配（空白不敏感）

      ## 常见陷阱
      - 使用 MODIFIED 但只包含部分内容会丢失 archive 时的细节。
      - 如果在不改变现有行为的情况下添加新关注点，使用 ADDED 而非 MODIFIED。

      ## 目录结构
      ```
      specs/<capability>/
        spec.md
      ```
    template: |
      ## ADDED Requirements

      ### Requirement: <!-- requirement name -->
      <!-- requirement text -->

      #### Scenario: <!-- scenario name -->
      - **WHEN** <!-- condition -->
      - **THEN** <!-- expected outcome -->
    unlocks: [tasks]
    requires:
      - proposal    

  - id: design
    description: 架构与模块设计文档
    outputPath: design.md
    depends: [proposal]
    instruction: |
      根据 proposal 中的 capability 列表，设计系统架构与模块细节。

      ## 何时创建 design.md（仅当以下任一适用）
      - 跨切面变更（多个服务/模块）或新的架构模式
      - 新的外部依赖或显著的数据模型变更
      - 安全、性能或迁移复杂性
      - 在编码前需要技术决策来消除歧义

      ## 章节要求
      - **Context**: 背景、当前状态、约束、利益相关方
      - **Goals / Non-Goals**: 设计目标和明确排除的范围
      - **Decisions**: 关键技术选择及其理由（为什么选 X 而非 Y？）。包括每个决策的替代方案。
      - **Risks / Trade-offs**: 已知限制、可能出错的地方。格式: [Risk] → Mitigation
      - **Migration Plan**: 部署步骤、回滚策略（如适用）
      - **Open Questions**: 待解决的决策或未知项

      ## 关键约束
      - 依赖 proposal 的 Capabilities 范围，不超范围设计
      - 聚焦架构和方法，而非逐行实现
      - 好的设计文档解释技术决策背后的"为什么"
    template: |
      ## Context

      <!-- Background and current state -->

      ## Goals / Non-Goals

      **Goals:**
      <!-- What this design aims to achieve -->

      **Non-Goals:**
      <!-- What is explicitly out of scope -->

      ## Decisions

      <!-- Key design decisions and rationale -->

      ## Risks / Trade-offs

      <!-- Known risks and trade-offs -->
    unlocks: [tasks]
    requires:
      - proposal

  - id: api-schema
    description: API 契约规格文件（OpenAPI YAML）
    outputPath: specs/<capability>/api.yaml
    depends: [specs]
    instruction: |
      根据 specs 中定义的 capability 生成 OpenAPI 3.x 契约文件。

      ## 要求
      - 为每个 capability 创建 `specs/<capability>/api.yaml`
      - 遵循 OpenAPI 3.x 规范
      - 语义化版本号
      - 接口路径前加 `/api/v{version}`
      - 包含完整请求/响应 schema
      - 包含标准错误响应定义
      - 使用 kebab-case 命名路径和参数

      ## 章节要求
      - **info**: title、version、description
      - **servers**: 开发/测试/生产环境 URL（Mock URL 占位）
      - **paths**: 按模块分组的接口路径
        - 每个操作包含 summary、operationId、tags
        - 请求参数（path、query、header）
        - 请求体 schema（引用 components）
        - 响应（200、201、204、400、401、403、404、500）
      - **components/schemas**: 数据模型定义
        - 枚举类型用 enum + description
        - 日期类型用 format: date-time
        - 金额用 integer（单位：分）
      - **components/responses**: 复用响应结构
      - **components/parameters**: 复用参数

      ## 格式要求
      - 每个接口 MUST 包含 operationId，用于 codegen 生成客户端
      - DTO 定义在 components/schemas 中，paths 中通过 $ref 引用
      - 错误响应使用 Problem JSON (RFC 7807) 格式
    template: |
      openapi: "3.0.3"
      info:
        title: <!-- capability name --> API
        version: "1.0.0"
        description: <!-- capability description -->
      servers:
        - url: http://localhost:8080/api/v1
          description: 开发环境
      paths:
        /<resource>:
          get:
            summary: <!-- operation summary -->
            operationId: list<Resource>
            tags:
              - <Resource>
            parameters:
              - $ref: '#/components/parameters/page'
              - $ref: '#/components/parameters/size'
            responses:
              '200':
                description: 成功
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/<Resource>ListResponse'
      components:
        schemas:
          ErrorResponse:
            type: object
            properties:
              type:
                type: string
              title:
                type: string
              status:
                type: integer
              detail:
                type: string
        responses:
          BadRequest:
            description: 请求参数错误
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
        parameters:
          page:
            name: page
            in: query
            schema:
              type: integer
              default: 0
          size:
            name: size
            in: query
            schema:
              type: integer
              default: 20
    unlocks: [tasks]
    requires:
      - proposal    

  - id: db-ddl
    description: 数据库 DDL 设计文档
    outputPath: spec/数据库设计DDL设计文档.sql
    depends: [design, specs]
    instruction: |
      根据 design.md 的数据模型和 specs 中的实体定义，生成数据库 DDL。

      ## 要求
      - 输出为单个 `.sql` 文件，包含完整 DDL
      - 包含 CREATE TABLE、索引、约束、注释
      - BEFORE CREATE TABLE 之前包含 drop-table-if-exists 语句
      - 表名使用小写加下划线（snake_case）
      - 主键统一命名为 `id`，使用 BIGINT UNSIGNED AUTO_INCREMENT
      - 审计字段：`create_time`（datetime）、`update_time`（datetime）
      - 逻辑删除字段：`is_deleted`（tinyint(1) DEFAULT 0）
      - 版本号字段：`version`（int DEFAULT 0），乐观锁使用

      ## 类型映射
      - VARCHAR(32)：短字符串（状态、枚举、手机号等）
      - VARCHAR(255)：普通字符串（名称、描述等）
      - TEXT：长文本（备注、JSON 配置等）
      - BIGINT：ID、金额（单位：分）、时间戳
      - INT：计数、序号、简单数值
      - DECIMAL(20,2)：货币金额
      - DATETIME：日期时间
      - TINYINT(1)：布尔值

      ## 索引规范
      - 主键：`PRIMARY KEY (id)`
      - 唯一索引：`uk_<表名>_<字段>` （如 uk_user_mobile）
      - 普通索引：`idx_<表名>_<字段>` （如 idx_order_user_id）
      - 联合索引：`idx_<表名>_<字段1>_<字段2>`
      - 外键：物理外键仅用于核心关联；非核心关联通过业务逻辑保证

      ## 注释规范
      - 表：`COMMENT = '表描述'`
      - 字段：`COMMENT '字段描述'`
      - 索引：`COMMENT '索引用途'`
    template: |
      -- ===================================================
      -- 数据库: <database_name>
      -- 说明: <description>
      -- ===================================================

      DROP TABLE IF EXISTS `<table_name>`;
      CREATE TABLE `<table_name>` (
        `id`             BIGINT UNSIGNED NOT NULL AUTO_INCREMENT  COMMENT '主键ID',
        `<field>`        <type>          NOT NULL                 COMMENT '<description>',
        `create_time`    DATETIME        NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '创建时间',
        `update_time`    DATETIME        NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP COMMENT '更新时间',
        `is_deleted`     TINYINT(1)      NOT NULL DEFAULT 0       COMMENT '逻辑删除：0-未删除，1-已删除',
        `version`        INT             NOT NULL DEFAULT 0       COMMENT '乐观锁版本号',
        PRIMARY KEY (`id`),
        KEY `idx_<table>_<field>` (`<field>`) COMMENT '<索引用途>'
      ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='<表描述>';
    unlocks: [tasks]
    requires:
      - proposal    

  - id: tasks
    description: 可执行任务清单
    outputPath: tasks.md
    depends: [design, specs, api-schema, db-ddl]
    instruction: |
      根据 design.md + specs/ 拆解为可执行的任务。

      ## 要求
      - 按模块分组，每组有标题
      - 每个任务包含：文件路径、实现要点、是否幂等/限流/降级等关注点
      - 使用 Markdown 复选框 `- [ ]` 跟踪进度
      - 任务应细化到可独立实现和验证的粒度
      - 按依赖关系排序（先做什么？）

      ## 格式
      ```
      ## N. 模块名称

      - [ ] N.1 实现 XX 功能（文件路径）
      - [ ] N.2 ...
      ```
    template: |
      ## 1. <!-- Task Group Name -->

      - [ ] 1.1 <!-- Task description -->
      - [ ] 1.2 <!-- Task description -->

      ## 2. <!-- Task Group Name -->

      - [ ] 2.1 <!-- Task description -->
      - [ ] 2.2 <!-- Task description -->
    requires:
      - specs
      - design
      - api-schema
      - db-ddl      

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    读取上下文文件，逐步完成 pending 任务，边做边标记完成。
    遇到阻塞或需要澄清时暂停。
