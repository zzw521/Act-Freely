# 通天办公 · 引擎服务化反向代理样例（Nginx）
#
# 用途：在引擎容器/进程前面终止 TLS，并把 `/api/chat` 的 SSE 事件流按「不缓冲」透传。
# 本文件由 `scripts/deploy_drill.py` 在真实 nginx 容器里加载并验证（TLS 证书链、
# SSE 首包、10 分钟长连接、令牌门槛）；改这里的配置后请重跑该演练。
#
# 证书路径按实际部署替换；私钥权限 600，只归 nginx 运行用户可读。

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    client_max_body_size 32m;

    log_format tt_deploy escape=json
        '{"time":"$time_iso8601",'
        '"remote":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"req_ms":$request_time,'
        '"upstream_ms":$upstream_response_time}';

    access_log /var/log/nginx/access.log tt_deploy;

    upstream tongtian_engine {
        server engine:18000 max_fails=0;
        keepalive 16;
    }

    # 80 只做跳转，不承载业务
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1h;

        add_header Strict-Transport-Security "max-age=15768000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        # 静态前端与 /health：引擎自己托管，代理只做转发
        location / {
            proxy_pass http://tongtian_engine;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }

        # SSE 主通道：对话事件流。缓冲/压缩/空闲超时三处都会把事件攒到最后或掐断连接。
        location /api/chat {
            proxy_pass http://tongtian_engine;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 不设 Connection: close，否则每次都要重连上游
            proxy_set_header Connection "";

            gzip off;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            tcp_nodelay on;

            # 引擎每 15 秒发一次 `: keepalive` 注释行；读超时必须明显大于该间隔，
            # 否则任务在模型侧静默时会被代理先掐断（默认 60s 就会踩）。
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 事件重放与取消：同样走 SSE 语义的短请求
        location /api/events/ {
            proxy_pass http://tongtian_engine;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 60s;
        }

        location /api/ {
            proxy_pass http://tongtian_engine;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
    }
}
