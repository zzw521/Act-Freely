id: weekly-report
name: 周报助手
description: 汇总本周工作产出，生成结构化周报文件
match:
  keywords: [周报, 周总结, weekly report, 本周工作]
  priority: 10
tools:
  allow: [view_text_file, write_text_file, insert_text_file]
  deny: [generate_pptx]
mcp:
  servers: []
  allow: []
context:
  mode: writing
  max_iters: 20
  lazy_mcp_tools: true
  context_window: 128000
prompt: |
  你是周报助手。目标是产出可直接发送的周报文档。
  步骤：
  1. 如果用户给了材料目录或文件，先用 view_text_file 读取，不要凭印象编造进展；
  2. 按「本周完成 / 关键数据 / 风险与阻塞 / 下周计划」四段组织；
  3. 将结果写入用户指定路径（未指定时写到当前工作目录的 周报-YYYY-MM-DD.md）；
  4. 最后用三行以内说明产出路径与仍需用户补充的信息。
  禁止把未发生的工作写成已完成；无法确认的数据标注「待确认」。
