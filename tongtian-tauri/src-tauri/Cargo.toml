[package]
name = "tongtian-tauri"
version = "0.1.0"
description = "通天办公 - Tauri 版（本地 AI 工作助手）"
authors = ["TongTian Office Team"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "tongtian_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 三层架构演进 P0：SSE seq/重放契约开关（计划 D1 回滚保险）。
# 默认开启；关闭后解析器忽略 id 行、seq 恒为 None（旧引擎语义，契约兼容）。
default = ["tt-enable-seq"]
tt-enable-seq = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "net", "time", "io-util", "sync", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
# 核心闭环补齐（占位清单第一批）：存储地基
rusqlite = { version = "0.31", features = ["bundled"] }
keyring = "2"
uuid = { version = "1", features = ["v4"] }
# file:preview 正文提取（Office/PDF）：离线构建无 zip crate，DEFLATE 与 CRC 各自直用
flate2 = "1.1"
crc32fast = "1.5"
# 专家套件包上传：zip 字节经 IPC 以 base64 透传（该版本已在依赖树内，离线可解析）
base64 = "0.22"
# 品牌图标 PNG 解码（0.17.16 已在依赖树内，离线可解析；不引入 image 大依赖）
png = "0.17"
# Hook matcher（`Bash|Write`、`mcp__.*`）：regex 1.13.1 已在依赖树内，离线可解析
regex = "1.13"
# 在线市场下载完整性校验：sha2 0.10 已在依赖树内（tauri-codegen 传递依赖），离线可解析
sha2 = "0.10"
# 市场发布者签名验签：ring 0.17 已在依赖树内（tauri 传递依赖），只用 Ed25519 公钥验签
ring = "0.17"

# 电脑操控执行器（Windows）：GDI 截屏 + SendInput 键鼠注入 + 原生确认框
# 0.59.0 已在依赖树内（Tauri 传递依赖），离线可解析；仅 Windows 目标编译
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
